name: Release & Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Desktop Installers (Windows NSIS .exe installer)
  # -------------------------------------------------------------
  build-desktop:
    name: Build Windows PC Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2026 Node.js 20 Deprecated -> Node.js 22 LTS or Node.js 24 requirement
      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Lint and Types
        run: npm run lint

      - name: Build Web App & Electron NSIS Installer
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 2: Web & Mobile PWA / Android APK Artifact Bundle
  # -------------------------------------------------------------
  build-mobile-cross-platform:
    name: Build Cross-Platform Web & Mobile Install Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2026 Node.js 20 Deprecated -> Node.js 22 LTS requirement
      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web / PWA App
        run: npm run build

      - name: Package Web PWA Standalone Bundle
        run: |
          cd dist
          zip -r ../release-web-pwa.zip .
          cd ..

      - name: Upload Cross-Platform Bundle to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-web-pwa.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
